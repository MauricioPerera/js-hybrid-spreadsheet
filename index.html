<script type="module">
import { pipeline, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

// ── State ─────────────────────────────────────────────
let embedder = null, generator = null;
let db, sheetsCol, vecStore, bm25, hybrid;
const COLS = 26, VISIBLE_ROWS = 50, DIM = 384;
let sheets = []; // [{ name, data: {[cellKey]: {value,formula}} }]
let activeSheet = 0, selectedCell = null;
let aiGenerating = false;

// ── IDBAdapter ────────────────────────────────────────
class IDBAdapter {
  constructor(n='hybrid-spreadsheet'){this.dbName=n;this._cache=new Map();this._db=null}
  async init(){
    this._db=await new Promise((r,j)=>{const q=indexedDB.open(this.dbName,1);q.onupgradeneeded=()=>q.result.createObjectStore('data');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
    const tx=this._db.transaction('data','readonly'),st=tx.objectStore('data');
    const[ks,vs]=await Promise.all([new Promise(r=>{const q=st.getAllKeys();q.onsuccess=()=>r(q.result)}),new Promise(r=>{const q=st.getAll();q.onsuccess=()=>r(q.result)})]);
    for(let i=0;i<ks.length;i++)this._cache.set(ks[i],vs[i]);
  }
  readJson(k){return this._cache.get('json:'+k)??null}
  writeJson(k,v){this._cache.set('json:'+k,v)}
  readBin(k){return this._cache.get('bin:'+k)??null}
  writeBin(k,v){this._cache.set('bin:'+k,v)}
  delete(k){this._cache.delete('json:'+k);this._cache.delete('bin:'+k)}
  async persist(){const tx=this._db.transaction('data','readwrite'),st=tx.objectStore('data');for(const[k,v]of this._cache)st.put(v,k);await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j})}
}

// ── Formula Engine (cross-sheet + VLOOKUP) ────────────
function colIdx(letter){return letter.charCodeAt(0)-65}
function colLetter(i){return String.fromCharCode(65+i)}
function parseRef(ref){const m=ref.match(/^([A-Z]+)(\d+)$/);return m?{col:colIdx(m[1]),row:parseInt(m[2])-1}:null}

/** Find sheet index by name (case-insensitive) */
function findSheet(name){
  const n=name.toLowerCase().replace(/['"]/g,'');
  return sheets.findIndex(s=>s.name.toLowerCase()===n);
}

/** Parse a ref that may include sheet: "Hoja2!A1" or just "A1" */
function parseFullRef(ref){
  if(ref.includes('!')){
    const[sheetName,cellRef]=ref.split('!');
    const si=findSheet(sheetName);
    return {sheetIdx:si>=0?si:activeSheet, cellKey:cellRef};
  }
  return {sheetIdx:activeSheet, cellKey:ref};
}

function expandRange(rangeStr){
  // Handle cross-sheet range: Hoja2!A1:B10
  let sheetIdx=activeSheet;
  let range=rangeStr;
  if(rangeStr.includes('!')){
    const[sheetName,rest]=rangeStr.split('!');
    const si=findSheet(sheetName);
    if(si>=0)sheetIdx=si;
    range=rest;
  }
  const[a,b]=range.split(':');
  const start=parseRef(a),end=parseRef(b);
  if(!start||!end)return[];
  const cells=[];
  for(let r=Math.min(start.row,end.row);r<=Math.max(start.row,end.row);r++)
    for(let c=Math.min(start.col,end.col);c<=Math.max(start.col,end.col);c++)
      cells.push({sheetIdx, key:colLetter(c)+(r+1)});
  return cells;
}

function getCellValue(keyOrFull,sheetIdx){
  const si=sheetIdx!==undefined?sheetIdx:activeSheet;
  let key=keyOrFull;
  // Handle cross-sheet ref
  if(typeof keyOrFull==='string'&&keyOrFull.includes('!')){
    const p=parseFullRef(keyOrFull);
    key=p.cellKey;
    return getCellValueFromSheet(p.sheetIdx,key);
  }
  return getCellValueFromSheet(si,key);
}

function getCellValueFromSheet(si,key){
  const d=sheets[si]?.data[key];
  if(!d)return 0;
  const v=d.computed!==undefined?d.computed:d.value;
  const n=parseFloat(v);
  return isNaN(n)?v:n;
}

function getValues(arg){
  if(arg.includes(':')){
    const cells=expandRange(arg);
    return cells.map(c=>getCellValueFromSheet(c.sheetIdx,c.key)).filter(v=>typeof v==='number');
  }
  const p=parseFullRef(arg);
  const v=getCellValueFromSheet(p.sheetIdx,p.cellKey);
  return typeof v==='number'?[v]:[];
}

/** Safe expression evaluator — only allows numbers, strings, operators, parens */
function safeEval(expr){
  const s=String(expr).trim();
  // Allow: numbers, strings, +, -, *, /, %, >, <, =, !, &, |, (, ), ., space, quotes
  if(/[^0-9a-zA-Z_.+\-*/%><=!&|() "',\s]/.test(s))return '#ERR';
  // Block dangerous patterns
  if(/\b(function|return|var|let|const|class|import|export|require|eval|window|document|fetch|alert|confirm|prompt)\b/i.test(s))return '#ERR';
  try{return Function('"use strict";return('+s+')')()}catch{return '#ERR'}
}

function evalFormula(formula,sheetIdx){
  const evalSheet=sheetIdx!==undefined?sheetIdx:activeSheet;
  try{
    let f=formula.slice(1).trim();

    // VLOOKUP(searchValue, range, colIndex, [exactMatch])
    f=f.replace(/VLOOKUP\(([^,]+),([^,]+),(\d+)(?:,([^)]*))?\)/gi,(_,searchVal,range,colIdxStr)=>{
      let search=searchVal.trim();
      // Resolve search value if it's a cell ref
      if(/^[A-Z]+\d+$/.test(search)||search.includes('!'))search=getCellValue(search,evalSheet);
      else{try{search=JSON.parse(search)}catch{}}

      const cells=expandRange(range.trim());
      if(!cells.length)return '#ERR';
      const ci=parseInt(colIdxStr)-1;

      // Group cells by row
      const rows=new Map();
      for(const c of cells){
        const r=parseRef(c.key);
        if(!r)continue;
        if(!rows.has(r.row))rows.set(r.row,[]);
        rows.get(r.row).push(c);
      }

      // Search first column for match
      for(const[,rowCells]of rows){
        rowCells.sort((a,b)=>parseRef(a.key).col-parseRef(b.key).col);
        const firstVal=getCellValueFromSheet(rowCells[0].sheetIdx,rowCells[0].key);
        if(firstVal==search||String(firstVal)===String(search)){
          if(ci<rowCells.length)return getCellValueFromSheet(rowCells[ci].sheetIdx,rowCells[ci].key);
          return '#REF';
        }
      }
      return '#N/A';
    });

    // HLOOKUP(searchValue, range, rowIndex)
    f=f.replace(/HLOOKUP\(([^,]+),([^,]+),(\d+)\)/gi,(_,searchVal,range,rowIdxStr)=>{
      let search=searchVal.trim();
      if(/^[A-Z]+\d+$/.test(search)||search.includes('!'))search=getCellValue(search,evalSheet);
      else{try{search=JSON.parse(search)}catch{}}

      const cells=expandRange(range.trim());
      const ri=parseInt(rowIdxStr)-1;
      const cols=new Map();
      for(const c of cells){
        const r=parseRef(c.key);
        if(!r)continue;
        if(!cols.has(r.col))cols.set(r.col,[]);
        cols.get(r.col).push(c);
      }
      for(const[,colCells]of cols){
        colCells.sort((a,b)=>parseRef(a.key).row-parseRef(b.key).row);
        const firstVal=getCellValueFromSheet(colCells[0].sheetIdx,colCells[0].key);
        if(firstVal==search||String(firstVal)===String(search)){
          if(ri<colCells.length)return getCellValueFromSheet(colCells[ri].sheetIdx,colCells[ri].key);
          return '#REF';
        }
      }
      return '#N/A';
    });

    // Standard functions
    f=f.replace(/SUM\(([^)]+)\)/gi,(_,args)=>{const vals=args.split(',').flatMap(a=>getValues(a.trim()));return vals.reduce((s,v)=>s+v,0)});
    f=f.replace(/(AVG|AVERAGE)\(([^)]+)\)/gi,(_,__,args)=>{const vals=args.split(',').flatMap(a=>getValues(a.trim()));return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0});
    f=f.replace(/COUNT\(([^)]+)\)/gi,(_,args)=>{const vals=args.split(',').flatMap(a=>getValues(a.trim()));return vals.length});
    f=f.replace(/MIN\(([^)]+)\)/gi,(_,args)=>{const vals=args.split(',').flatMap(a=>getValues(a.trim()));return vals.length?Math.min(...vals):0});
    f=f.replace(/MAX\(([^)]+)\)/gi,(_,args)=>{const vals=args.split(',').flatMap(a=>getValues(a.trim()));return vals.length?Math.max(...vals):0});
    f=f.replace(/COUNTIF\(([^,]+),([^)]+)\)/gi,(_,range,cond)=>{
      const vals=expandRange(range.trim()).map(c=>getCellValueFromSheet(c.sheetIdx,c.key));
      let crit=cond.trim().replace(/^["']|["']$/g,'');
      const op=crit.match(/^([><=!]+)(.*)/);
      if(op){const threshold=parseFloat(op[2]);return vals.filter(v=>{const n=parseFloat(v);switch(op[1]){case'>':return n>threshold;case'>=':return n>=threshold;case'<':return n<threshold;case'<=':return n<=threshold;case'<>':case'!=':return n!==threshold;default:return n===threshold}}).length}
      return vals.filter(v=>String(v)===crit).length;
    });
    f=f.replace(/SUMIF\(([^,]+),([^,]+)(?:,([^)]+))?\)/gi,(_,range,cond,sumRange)=>{
      const checkCells=expandRange(range.trim());
      const sumCells=sumRange?expandRange(sumRange.trim()):checkCells;
      let crit=cond.trim().replace(/^["']|["']$/g,'');
      const op=crit.match(/^([><=!]+)(.*)/);
      let total=0;
      for(let i=0;i<checkCells.length;i++){
        const cv=getCellValueFromSheet(checkCells[i].sheetIdx,checkCells[i].key);
        let match=false;
        if(op){const n=parseFloat(cv),th=parseFloat(op[2]);switch(op[1]){case'>':match=n>th;break;case'>=':match=n>=th;break;case'<':match=n<th;break;case'<=':match=n<=th;break;default:match=n===th}}
        else match=String(cv)===crit;
        if(match&&i<sumCells.length){const sv=getCellValueFromSheet(sumCells[i].sheetIdx,sumCells[i].key);if(typeof sv==='number')total+=sv;else{const n=parseFloat(sv);if(!isNaN(n))total+=n}}
      }
      return total;
    });
    f=f.replace(/IF\(([^,]+),([^,]+),([^)]+)\)/gi,(_,cond,t,fl)=>{
      try{
        const resolved=cond.replace(/(?:[\w\s]+!)?[A-Z]+\d+/g,m=>JSON.stringify(getCellValue(m,evalSheet)));
        const condResult=safeEval(resolved);
        const tVal=t.trim(),fVal=fl.trim();
        const result=condResult?safeEval(tVal):safeEval(fVal);
        return result;
      }catch{return '#ERR'}
    });
    f=f.replace(/CONCAT\(([^)]+)\)/gi,(_,args)=>args.split(',').map(a=>{a=a.trim();if(/^(?:[\w\s]+!)?[A-Z]+\d+$/.test(a))return String(getCellValue(a,evalSheet));return a.replace(/^["']|["']$/g,'')}).join(''));

    // Cell references (including cross-sheet: Hoja2!A1)
    f=f.replace(/([\w\s]+![A-Z]+\d+)/g,m=>{const v=getCellValue(m,evalSheet);return typeof v==='number'?v:JSON.stringify(v)});
    f=f.replace(/([A-Z]+\d+)/g,m=>{const v=getCellValueFromSheet(evalSheet,m);return typeof v==='number'?v:JSON.stringify(v)});

    return safeEval(f);
  }catch(e){return '#ERR'}
}

/** Recalculate ALL sheets (cross-sheet deps) */
function recalcAll(){
  // Two passes: first pass resolves within-sheet, second resolves cross-sheet
  for(let pass=0;pass<2;pass++){
    for(let si=0;si<sheets.length;si++){
      const data=sheets[si]?.data;
      if(!data)continue;
      for(const[key,cell]of Object.entries(data)){
        if(cell.formula) cell.computed=evalFormula(cell.formula,si);
      }
    }
  }
}

// ── Init ──────────────────────────────────────────────
const adapter=new IDBAdapter();

async function init(){
  try{await adapter.init()}catch(e){document.getElementById('hdr-stats').textContent='Error: IndexedDB';return}

  db=new DocStore(adapter);
  sheetsCol=db.collection('sheets');
  vecStore=new PolarQuantizedStore(adapter,DIM);
  bm25=new BM25Index();
  hybrid=new HybridSearch(vecStore,bm25,'rrf');

  // Load sheets
  const saved=sheetsCol.find({}).sort({order:1}).toArray();
  if(saved.length>0){
    sheets=saved.map(s=>({name:s.name,data:s.data||{},_id:s._id}));
  }else{
    const s=sheetsCol.insert({name:'Hoja 1',data:{},order:0});
    sheets=[{name:'Hoja 1',data:{},_id:s._id}];
  }

  activeSheet=0;
  renderGrid();
  renderSheetTabs();
  updateStats();

  loadEmbedder();
  loadLLM();
}

async function persistAll(){
  for(const s of sheets){
    if(s._id)sheetsCol.update({_id:s._id},{$set:{data:s.data,name:s.name}});
  }
  db.flush();
  await adapter.persist();
}

// ── Model Loading ─────────────────────────────────────
function setStatus(m,s,t){const e=document.getElementById(m+'-status');e.className='model-badge '+s;e.textContent=t}

async function loadEmbedder(){
  const t0=performance.now();setStatus('embed','loading','E5...');
  try{
    embedder=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{progress_callback:p=>{if(p.status==='progress'&&p.total){document.getElementById('embed-fill').style.width=Math.round(p.loaded/p.total*100)+'%'}}});
    const el=((performance.now()-t0)/1000).toFixed(1);
    setStatus('embed','ready',`E5 ${parseFloat(el)<10?'(cache)':'ok'} ${el}s`);
    document.getElementById('embed-progress').style.display='none';
  }catch(e){setStatus('embed','error','E5 err');console.error(e)}
}

async function loadLLM(){
  const t0=performance.now(),dev=navigator.gpu?'webgpu':'wasm',dt=dev==='webgpu'?'q4f16':'q4';
  setStatus('llm','loading','Qwen3...');
  try{
    generator=await pipeline('text-generation','onnx-community/Qwen3-0.6B-ONNX',{device:dev,dtype:dt,progress_callback:p=>{if(p.status==='progress'&&p.total){document.getElementById('llm-fill').style.width=Math.round(p.loaded/p.total*100)+'%'}}});
    const el=((performance.now()-t0)/1000).toFixed(1);
    setStatus('llm','ready',`Qwen3 ${parseFloat(el)<15?'(cache)':'ok'} ${el}s ${dev}`);
    document.getElementById('llm-progress').style.display='none';
  }catch(e){setStatus('llm','error','LLM err');console.error(e)}
}

// ── LLM ───────────────────────────────────────────────
async function generate(prompt,opts={}){
  if(!generator)throw new Error('LLM no cargado');
  const out=await generator([{role:'system',content:opts.system||'Eres un asistente de hojas de calculo. Responde conciso.'},{role:'user',content:prompt+'\n/no_think'}],{max_new_tokens:opts.maxTokens||256,do_sample:false});
  return out[0].generated_text.at(-1).content.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
}

async function generateStream(prompt,outputEl,opts={}){
  if(!generator){outputEl.textContent='LLM no cargado...';return}
  aiGenerating=true;outputEl.innerHTML='<span class="generating">Generando...</span>';
  let raw='';
  const streamer=new TextStreamer(generator.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{raw+=t;outputEl.textContent=raw.replace(/<think>[\s\S]*?<\/think>/g,'').trim();outputEl.scrollTop=outputEl.scrollHeight}});
  try{await generator([{role:'system',content:opts.system||'Eres un asistente de hojas de calculo. Responde en el idioma del usuario.'},{role:'user',content:prompt+'\n/no_think'}],{max_new_tokens:opts.maxTokens||300,do_sample:false,streamer})}catch(e){outputEl.textContent+='\n[Error: '+e.message+']'}
  aiGenerating=false;
  return raw.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
}

// ── Grid Render ───────────────────────────────────────
function renderGrid(){
  const data=sheets[activeSheet]?.data||{};
  recalcAll();

  // Determine grid size
  let maxRow=VISIBLE_ROWS,maxCol=COLS;
  for(const k of Object.keys(data)){
    const r=parseRef(k);
    if(r){maxRow=Math.max(maxRow,r.row+2);maxCol=Math.max(maxCol,r.col+1)}
  }

  let html='<thead><tr><th class="corner"></th>';
  for(let c=0;c<maxCol;c++) html+=`<th class="col-hdr" data-col="${c}">${colLetter(c)}</th>`;
  html+='</tr></thead><tbody>';

  for(let r=0;r<maxRow;r++){
    html+=`<tr><th class="row-hdr">${r+1}</th>`;
    for(let c=0;c<maxCol;c++){
      const key=colLetter(c)+(r+1);
      const cell=data[key];
      const val=cell?(cell.computed!==undefined?cell.computed:cell.value):'';
      const isNum=typeof val==='number'||(!isNaN(parseFloat(val))&&val!=='');
      const isFormula=cell?.formula;
      const isErr=val==='#ERR';
      const cls=selectedCell===key?'selected':'';
      html+=`<td class="${cls}" data-key="${key}" onclick="selectCell('${key}')" ondblclick="editCell('${key}')"><div class="cell-display${isNum?' num':''}${isFormula?' formula':''}${isErr?' err':''}">${esc(String(val??''))}</div></td>`;
    }
    html+='</tr>';
  }
  html+='</tbody>';
  document.getElementById('grid').innerHTML=html;
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ── Cell Interaction ──────────────────────────────────
window.selectCell=function(key){
  selectedCell=key;
  document.getElementById('cell-ref').value=key;
  const cell=sheets[activeSheet]?.data[key];
  document.getElementById('formula-input').value=cell?.formula||cell?.value||'';
  // Update visual selection
  document.querySelectorAll('.grid td.selected').forEach(e=>e.classList.remove('selected'));
  const td=document.querySelector(`[data-key="${key}"]`);
  if(td)td.classList.add('selected');
};

window.editCell=function(key){
  const td=document.querySelector(`[data-key="${key}"]`);
  if(!td)return;
  selectedCell=key;
  const cell=sheets[activeSheet]?.data[key];
  const val=cell?.formula||cell?.value||'';
  td.innerHTML=`<input class="cell-edit" value="${esc(String(val))}" onblur="finishEdit('${key}',this.value)" onkeydown="if(event.key==='Enter'){finishEdit('${key}',this.value);event.preventDefault()}else if(event.key==='Escape'){renderGrid()}" autofocus />`;
  td.querySelector('input').focus();
  td.querySelector('input').select();
};

window.finishEdit=function(key,val){
  if(!sheets[activeSheet])return;
  val=val.trim();
  if(val===''){
    delete sheets[activeSheet].data[key];
  }else if(val.startsWith('=')){
    sheets[activeSheet].data[key]={value:val,formula:val,computed:evalFormula(val,activeSheet)};
  }else{
    const num=parseFloat(val);
    sheets[activeSheet].data[key]={value:isNaN(num)?val:num};
  }
  recalcAll();
  // Update only changed cells instead of full re-render
  updateCellDisplay(key);
  // Also update cells that might depend on this one
  const data=sheets[activeSheet]?.data||{};
  for(const[k,c]of Object.entries(data)){
    if(c.formula&&k!==key)updateCellDisplay(k);
  }
  selectCell(key);
  updateStats();
  persistAll();
};

function updateCellDisplay(key){
  const td=document.querySelector(`[data-key="${key}"]`);
  if(!td)return;
  const cell=sheets[activeSheet]?.data[key];
  const val=cell?(cell.computed!==undefined?cell.computed:cell.value):'';
  const isNum=typeof val==='number'||(!isNaN(parseFloat(val))&&val!=='');
  const isFormula=cell?.formula;
  const isErr=val==='#ERR'||val==='#N/A'||val==='#REF';
  td.innerHTML=`<div class="cell-display${isNum?' num':''}${isFormula?' formula':''}${isErr?' err':''}">${esc(String(val??''))}</div>`;
}

window.commitFormula=function(){
  if(!selectedCell)return;
  const val=document.getElementById('formula-input').value;
  finishEdit(selectedCell,val);
};

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(!selectedCell||document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;
  const ref=parseRef(selectedCell);
  if(!ref)return;
  let nr=ref.row,nc=ref.col;
  if(e.key==='ArrowDown')nr++;
  else if(e.key==='ArrowUp')nr=Math.max(0,nr-1);
  else if(e.key==='ArrowRight'||e.key==='Tab'){nc=Math.min(COLS-1,nc+1);e.preventDefault()}
  else if(e.key==='ArrowLeft')nc=Math.max(0,nc-1);
  else if(e.key==='Enter'){editCell(selectedCell);e.preventDefault();return}
  else if(e.key==='Delete'||e.key==='Backspace'){finishEdit(selectedCell,'');return}
  else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){editCell(selectedCell);return}
  else return;
  const nk=colLetter(nc)+(nr+1);
  selectCell(nk);
  const td=document.querySelector(`[data-key="${nk}"]`);
  if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
});

// ── Sheet Tabs ────────────────────────────────────────
function renderSheetTabs(){
  document.getElementById('sheet-tabs').innerHTML=sheets.map((s,i)=>
    `<button class="sheet-tab ${i===activeSheet?'active':''}" onclick="switchSheet(${i})" ondblclick="renameSheet(${i})" oncontextmenu="event.preventDefault();deleteSheet(${i})">${esc(s.name)}</button>`
  ).join('');
}

window.switchSheet=function(i){
  persistAll();
  activeSheet=i;
  renderGrid();
  renderSheetTabs();
  selectedCell=null;
  document.getElementById('cell-ref').value='';
  document.getElementById('formula-input').value='';
};

window.addSheet=function(){
  const name='Hoja '+(sheets.length+1);
  const s=sheetsCol.insert({name,data:{},order:sheets.length});
  sheets.push({name,data:{},_id:s._id});
  switchSheet(sheets.length-1);
  persistAll();
};

window.renameSheet=function(i){
  const name=prompt('Nombre de la hoja:',sheets[i].name);
  if(!name||!name.trim())return;
  sheets[i].name=name.trim();
  renderSheetTabs();
  persistAll();
};

window.deleteSheet=function(i){
  if(sheets.length<=1){alert('No puedes eliminar la unica hoja');return}
  if(!confirm('Eliminar "'+sheets[i].name+'"?'))return;
  if(sheets[i]._id)sheetsCol.removeById(sheets[i]._id);
  sheets.splice(i,1);
  if(activeSheet>=sheets.length)activeSheet=sheets.length-1;
  renderGrid();renderSheetTabs();updateStats();persistAll();
};

// ── Search ────────────────────────────────────────────
window.toggleSearch=function(){document.getElementById('search-bar').classList.toggle('visible')};

window.onSearch=function(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){document.getElementById('search-results').textContent='';document.querySelectorAll('.grid td.in-range').forEach(e=>e.classList.remove('in-range'));return}

  // Search ALL sheets
  let totalMatches=0;const localMatches=[];
  for(let si=0;si<sheets.length;si++){
    const data=sheets[si]?.data||{};
    for(const[key,cell]of Object.entries(data)){
      const val=String(cell.computed!==undefined?cell.computed:cell.value).toLowerCase();
      if(val.includes(q)){totalMatches++;if(si===activeSheet)localMatches.push(key)}
    }
  }

  document.querySelectorAll('.grid td.in-range').forEach(e=>e.classList.remove('in-range'));
  localMatches.forEach(k=>{const td=document.querySelector(`[data-key="${k}"]`);if(td)td.classList.add('in-range')});
  const extra=totalMatches-localMatches.length;
  let txt=localMatches.length+' aqui';
  if(extra>0)txt+=', '+extra+' en otras hojas';
  document.getElementById('search-results').textContent=txt;
  if(localMatches.length>0)selectCell(localMatches[0]);
};

// ── CSV Parser (handles quoted fields, commas in values, newlines) ─────
function parseCSVText(text){
  const rows=[]; let row=[]; let field=''; let inQuote=false;
  const sep=text.indexOf('\t')>=0&&text.indexOf('\t')<text.indexOf('\n')?'\t':',';
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuote){
      if(c==='"'&&text[i+1]==='"'){field+='"';i++}
      else if(c==='"')inQuote=false;
      else field+=c;
    }else{
      if(c==='"')inQuote=true;
      else if(c===sep){row.push(field.trim());field=''}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field.trim());if(row.some(c=>c!==''))rows.push(row);row=[];field=''}
      else field+=c;
    }
  }
  row.push(field.trim());if(row.some(c=>c!==''))rows.push(row);
  return rows;
}

function escapeCSVField(val){
  const s=String(val);
  if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

// ── Import/Export CSV ─────────────────────────────────
window.importCSV=function(){document.getElementById('csv-file').click()};

window.handleCSVImport=function(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    let rows;
    if(file.name.endsWith('.json')){
      try{const j=JSON.parse(text);if(Array.isArray(j)){rows=j.map(r=>Object.values(r).map(String))}else return}catch{return}
    }else{
      rows=parseCSVText(text);
    }
    const data={};
    rows.forEach((row,ri)=>{
      row.forEach((val,ci)=>{
        if(ci<COLS&&val){const num=parseFloat(val);data[colLetter(ci)+(ri+1)]={value:isNaN(num)?val:num}}
      });
    });
    sheets[activeSheet].data=data;
    recalcAll();renderGrid();updateStats();persistAll();
  };
  reader.readAsText(file);
  event.target.value='';
};

window.dropCSV=function(event){
  event.preventDefault();
  event.currentTarget.style.opacity='1';
  const file=Array.from(event.dataTransfer.files).find(f=>f.name.match(/\.(csv|tsv|json)$/i));
  if(!file){alert('Solo CSV, TSV, o JSON');return}
  // Reuse handleCSVImport logic
  const fakeEvent={target:{files:[file],value:''},preventDefault:()=>{}};
  fakeEvent.target.value='';
  handleCSVImport(fakeEvent);
};

window.exportCSV=function(){
  const data=sheets[activeSheet]?.data||{};
  let maxR=0,maxC=0;
  for(const k of Object.keys(data)){const r=parseRef(k);if(r){maxR=Math.max(maxR,r.row);maxC=Math.max(maxC,r.col)}}
  let csv='';
  for(let r=0;r<=maxR;r++){
    const row=[];
    for(let c=0;c<=maxC;c++){
      const cell=data[colLetter(c)+(r+1)];
      const v=cell?(cell.computed!==undefined?cell.computed:cell.value):'';
      row.push(escapeCSVField(v));
    }
    csv+=row.join(',')+'\n';
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=sheets[activeSheet].name.replace(/\s+/g,'_')+'.csv';a.click();
};

// ── AI ────────────────────────────────────────────────
window.toggleAI=function(){document.getElementById('ai-panel').classList.toggle('hidden')};

function getSheetSummary(){
  const data=sheets[activeSheet]?.data||{};
  const entries=Object.entries(data).slice(0,50);
  if(!entries.length)return 'Hoja vacia.';
  return entries.map(([k,c])=>k+': '+(c.formula||c.computed||c.value)).join('\n');
}

window.aiAction=async function(action){
  if(aiGenerating)return;
  const output=document.getElementById('ai-output');
  const summary=getSheetSummary();
  const prompts={
    formula:{system:'Eres un experto en hojas de calculo. Sugiere formulas. Responde solo la formula, ej: =SUM(A1:A10)',prompt:`Datos actuales:\n${summary}\n\nCelda seleccionada: ${selectedCell||'A1'}\nSugiere una formula util para esta celda.`},
    analyze:{system:'Analiza datos de hojas de calculo. Se conciso.',prompt:`Analiza estos datos y describe patrones o insights:\n${summary}`},
    summarize:{system:'Resume datos de hojas de calculo.',prompt:`Resume los datos de esta hoja:\n${summary}`},
    fill:{system:'Eres un experto en datos. Sugiere valores para auto-completar.',prompt:`Datos actuales:\n${summary}\n\nCelda seleccionada: ${selectedCell||'A1'}\nSugiere valores para completar la columna basandote en el patron.`}
  };
  const cfg=prompts[action];
  await generateStream(cfg.prompt,output,{system:cfg.system});
};

window.aiAsk=async function(){
  if(aiGenerating)return;
  const input=document.getElementById('ai-question');
  const q=input.value.trim();if(!q)return;input.value='';
  const output=document.getElementById('ai-output');
  const summary=getSheetSummary();
  await generateStream(`Datos de la hoja:\n${summary}\n\nPregunta: ${q}`,output,{system:'Responde preguntas sobre datos de hojas de calculo. Se preciso y conciso.'});
};

// ── Stats ─────────────────────────────────────────────
function updateStats(){
  const data=sheets[activeSheet]?.data||{};
  const cells=Object.keys(data).length;
  const formulas=Object.values(data).filter(c=>c.formula).length;
  document.getElementById('hdr-stats').textContent=`${cells} celdas | ${formulas} formulas | ${sheets.length} hoja${sheets.length>1?'s':''}`;
}

init();
</script>
